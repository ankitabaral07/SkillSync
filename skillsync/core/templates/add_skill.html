<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Skill - SkillSync</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button,
        .cancel {
            padding: 12px 22px;
            border-radius: 9px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
        }

        button:hover {
            background: #4338ca;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel:hover {
            background: #d1d5db;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="box">

        <h1>
            Add a Skill ✨
        </h1>

        <p class="subtitle">
            Add a skill you can teach or want to learn.
        </p>


        <form method="POST">

            {% csrf_token %}


            <label for="name">
                Skill Name
            </label>

           <input 
               type="text" 
               id="skill_name" 
               name="skill_name" 
               placeholder="Example: Python" 
               required
           >


            <label for="skill_type">
                Skill Type
            </label>

            <select
                id="skill_type"
                name="skill_type"
                required
            >

                <option value="">
                    Select skill type
                </option>

                <option value="teach">
                    🧑‍🏫 I Can Teach
                </option>

                <option value="learn">
                    📚 I Want to Learn
                </option>

            </select>


            <div class="buttons">

                <button type="submit">
                    ➕ Add Skill
                </button>

                <a
                    href="{% url 'dashboard' %}"
                    class="cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>


</body>

</html>
