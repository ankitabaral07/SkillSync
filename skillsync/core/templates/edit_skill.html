<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Skill - SkillSync</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 80px auto;
            padding: 30px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #4f46e5;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="box">

        <h1>
            ✏️ Edit Skill
        </h1>

        <p class="subtitle">
            Update your skill information.
        </p>


        <form method="POST">

            {% csrf_token %}


            <label>
                Skill Name
            </label>

            <input
                type="text"
                name="skill_name"
                value="{{ skill.name }}"
                required
            >


            <label>
                Skill Type
            </label>

            <select
                name="skill_type"
                required
            >

                <option
                    value="teach"
                    {% if skill.skill_type == 'teach' %}selected{% endif %}
                >
                    Can Teach
                </option>

                <option
                    value="learn"
                    {% if skill.skill_type == 'learn' %}selected{% endif %}
                >
                    Want to Learn
                </option>

            </select>


            <button type="submit">
                💾 Save Changes
            </button>

        </form>


        <a
            href="{% url 'dashboard' %}"
            class="back"
        >
            ← Back to Dashboard
        </a>

    </div>

</div>

</body>

</html>
