<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - SkillSync</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 20px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button,
        .cancel {
            padding: 12px 22px;
            border-radius: 9px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            border: none;
            background: #4f46e5;
            color: white;
        }

        button:hover {
            background: #4338ca;
        }

        .cancel {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel:hover {
            background: #d1d5db;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="box">

        <h1>Edit Profile ✨</h1>

        <p class="subtitle">
            Update your SkillSync profile information.
        </p>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label for="bio">
                About Me
            </label>

            <textarea
                id="bio"
                name="bio"
                placeholder="Tell something about yourself..."
            >{{ profile.bio }}</textarea>

            <label for="skills_to_teach">
                 Skills I Can Teach
            </label>

            <textarea
                id="skills_to_teach"
                name="skills_to_teach"
                placeholder="Example: HTML, CSS, JavaScript, Python"
            >{{ profile.skills_to_teach }}</textarea>


            <label for="skills_to_learn">
                Skills I Want to Learn
            </label>

            <textarea
                id="skills_to_learn"
                name="skills_to_learn"
                placeholder="Example: Django, Python, AI/ML"
            >{{ profile.skills_to_learn }}</textarea>

            <label for="profile_image">
                Profile Picture
            </label>

            <input
                type="file"
                id="profile_image"
                name="profile_image"
                accept="image/*"
            >


            <div class="buttons">

                <button type="submit">
                    Save Changes
                </button>

                <a
                    href="{% url 'profile' %}"
                    class="cancel"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
